name: Probe retailers

# Diagnostic: runs whenever this file changes; results are read from the job
# log. Used to investigate retailer platforms/URLs before adding them to the
# roster (the dev sandbox has no direct network access to retailer sites).

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: japanesenaturalstones.com — platform detection
        run: |
          for host in www.japanesenaturalstones.com japanesenaturalstones.com; do
            echo "===== $host shopify probe"
            curl -sSL --max-time 20 "https://$host/products.json?limit=1" | head -c 300; echo
            echo "===== $host woocommerce probe"
            curl -sSL --max-time 20 "https://$host/wp-json/wc/store/v1/products?per_page=1" | head -c 300; echo
            echo "===== $host homepage platform markers"
            curl -sSL --max-time 20 "https://$host" -o h.html || true
            grep -oiE 'squarespace|woocommerce|shopify|bigcommerce|wp-content|cdn/shop' h.html | sort | uniq -c | head; echo
          done
