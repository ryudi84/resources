name: Probe retailers

# Diagnostic: runs whenever this file changes; results are read from the job
# log. Used to investigate retailer platforms/URLs before adding them to the
# roster (the dev sandbox has no direct network access to retailer sites).

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: JNS GraphQL diagnostics
        run: |
          curl -sSL --max-time 20 "https://www.japanesenaturalstones.com" -o h.html || true
          TOKEN=$(grep -oE 'graphQLToken\\?["'"'"']?\s*[:=]\s*\\?["'"'"'][A-Za-z0-9._-]{20,}' h.html | grep -oE '[A-Za-z0-9._-]{20,}$' | head -1)
          echo "token length: ${#TOKEN}"
          gq() { curl -sS --max-time 20 -X POST "https://www.japanesenaturalstones.com/graphql" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          echo "== total items =="
          gq '{"query":"query{site{products(first:1){collectionInfo{totalItems}edges{node{name}}pageInfo{endCursor}}}}"}' | head -c 600; echo
          echo "== page1 names =="
          gq '{"query":"query{site{products(first:3){pageInfo{endCursor}edges{node{name}}}}}"}' > p1.json
          head -c 700 p1.json; echo
          CURSOR=$(grep -oE '"endCursor":"[^"]+"' p1.json | head -1 | cut -d'"' -f4)
          echo "== page2 names (after $CURSOR) =="
          gq "{\"query\":\"query{site{products(first:3,after:\\\"$CURSOR\\\"){edges{node{name}}}}}\"}" | head -c 700; echo
          echo "== search: raquin =="
          gq '{"query":"query{site{search{searchProducts(filters:{searchTerm:\"raquin\"}){products(first:8){edges{node{name path brand{name}prices{price{value currencyCode}}inventory{isInStock}}}}}}}"}' | head -c 2000; echo
          echo "== search: takada =="
          gq '{"query":"query{site{search{searchProducts(filters:{searchTerm:\"takada\"}){products(first:8){edges{node{name inventory{isInStock}}}}}}}"}' | head -c 1200; echo
