name: Probe retailers

# Diagnostic: runs whenever this file changes; results are read from the job
# log. Used to investigate retailer platforms/URLs before adding them to the
# roster (the dev sandbox has no direct network access to retailer sites).

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: JNS BigCommerce GraphQL token + query test
        run: |
          curl -sSL --max-time 20 "https://www.japanesenaturalstones.com" -o h.html || true
          echo "== token candidates =="
          grep -oE 'graphQLToken[^,]{0,200}' h.html | head -c 500; echo
          grep -oE '"storefront_api[^}]{0,300}' h.html | head -c 500; echo
          TOKEN=$(grep -oE 'graphQLToken['"'"'"]?\s*[:=]\s*['"'"'"][A-Za-z0-9._-]+' h.html | grep -oE '[A-Za-z0-9._-]+$' | head -1)
          echo "token length: ${#TOKEN}"
          echo "== graphql products query =="
          curl -sS --max-time 20 -X POST "https://www.japanesenaturalstones.com/graphql" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"query{site{products(first:3){pageInfo{hasNextPage endCursor}edges{node{name path sku brand{name}prices{price{value currencyCode}basePrice{value}salePrice{value}}inventory{isInStock}}}}}}"}' | head -c 1500
          echo
