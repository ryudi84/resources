name: Grail knife scan

on:
  schedule:
    # Every 20 minutes. Takada drops sell out fast — tighten to */10 if you
    # dare, but note GitHub delays busy cron slots.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'grails.json'
      - 'retailers.json'
      - 'src/**'
      - '.github/workflows/scan.yml'

concurrency:
  group: grail-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Scan retailers
        env:
          # Configure any of these as repository secrets to get pinged the
          # moment a grail comes in stock. NTFY_TOPIC is the easiest: pick a
          # unique topic string and subscribe to it in the ntfy app.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run scan

      - name: Commit updated stock data & dashboard
        run: |
          git config user.name "grail-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No stock changes this sweep."
          else
            git commit -m "scan: stock sweep $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}"
          fi
